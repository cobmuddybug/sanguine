# Hunts: daily and weekly trials. Accept one while you are still short of its goals, obey the rule, finish before
# the day (UTC) or week ends. Rules: no_rites | no_thralls | no_frenzy | fevered (the Inquisition runs hot).
# goals: venture is 1-based, units is how many you must hold.

[[hunt]]
id = "h1"
name = "Bare Hands"
blurb = "Build a household without a single Rite."
rule = "no_rites"
goals = [{ venture = 2, units = 50 }, { venture = 4, units = 25 }]

[[hunt]]
id = "h2"
name = "No Servants"
blurb = "Do it yourself. No Thralls may be bound."
rule = "no_thralls"
goals = [{ venture = 3, units = 40 }, { venture = 5, units = 20 }]

[[hunt]]
id = "h3"
name = "Sober Frenzy"
blurb = "Hunt without Frenzy. Calm, and a little cruel."
rule = "no_frenzy"
goals = [{ venture = 4, units = 50 }, { venture = 6, units = 25 }]

[[hunt]]
id = "h4"
name = "Fevered"
blurb = "The Inquisition runs hot tonight."
rule = "fevered"
goals = [{ venture = 5, units = 50 }, { venture = 7, units = 25 }]

[[hunt]]
id = "h5"
name = "Bare Hands, Bigger Mouth"
