# Bloodline tree (spent with Potency). Three branches, each a chain (node N requires node N-1).
# effect kinds: start_proxies (sum) | offline_eff (sum) | start_capital (max) | all_mult (product)
#               tier_mult (product, tiers tier_from..tier_to, 1-based) | momentum_cap (sum) |
#               momentum_grace (sum) | momentum_bonus (sum) | reveal (sum) |
#               proxy_discount (max) | unit_discount (max)

[[branch]]
id = "exit"
name = "THE LONG SLEEP"
blurb = "Rest, beautiful monster. The household feeds in your name."

[[branch]]
id = "voice"
name = "PREDATION"
blurb = "Mercy was a mortal habit. Shed it, one bite at a time."

[[branch]]
id = "accel"
name = "PERDITION"
blurb = "Frenzy, and Hell arriving early, dressed for dinner."

