# Dynasty: the second prestige. Perks are bought with Lineage and survive every Dynasty.
# effect kinds: all_mult (product) | tier_mult (product, tiers tier_from..tier_to, 1-based) | keep_tree_cost (max:
#   Bloodline nodes costing <= value survive a Dynasty) | offline_cap (sum, hours) | sov_gain (sum, fraction) |
#   lineage_gain (sum, fraction) | auto_exit (flag: the Retainer sleeps for you) | momentum_cap (sum)
# An entry with `endless = true` is repeatable: cost = cost * growth^level, effect applies value^level.

[[perk]]
id = "p1"
name = "Heirloom Bloodline"
desc = "The cheap Bloodline awakenings (cost 20 or less) survive every Dynasty."
cost = 2
effect = "keep_tree_cost"
value = 20

[[perk]]
id = "p2"
name = "Inherited Sleep"
desc = "Offline cap +8 hours."
cost = 4
effect = "offline_cap"
value = 8

[[perk]]
id = "p3"
name = "The Quiet Retainer"
desc = "A servant who enters Torpor for you when it is clearly worth it. Toggle it here."
cost = 6
requires = "p1"
effect = "auto_exit"
value = 1

[[perk]]
id = "p4"
