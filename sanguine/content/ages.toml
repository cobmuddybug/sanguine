# Ages: long real-time commissions. You commit Blood now (cost_hours x your potential income per hour),
# pick a choice, and collect when the clock runs out. They cannot be rushed and they wait while you are away.
# reward kinds: lineage (flat) | legacy (permanent +fraction to all output) | buff (mult for `hours` of play) |
#               blood (hours of your potential income, paid in Blood)

[[age]]
